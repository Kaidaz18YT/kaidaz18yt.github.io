<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>YouTube Clip Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1C1B1A;
            --bg-raised: #242321;
            --bg-hover: #2C2B28;
            --border: #38362f;
            --border-soft: #2c2b27;

            --ink: #EDEAE3;
            --ink-dim: #A8A399;
            --ink-faint: #6f6b62;

            --accent: #7C93CC;
            --accent-dim: #4A5D8A;
            --amber: #C9A15C;
            --sage: #8FA184;
            --danger: #C97C6E;
            --brand-red: #C1443A;
            --brand-red-dim: #8B322A;
            --brand-red-glow: rgba(193,68,58,0.18);

            --radius: 3px;
            color-scheme: dark;

            /* legacy aliases mapped onto the ledger palette */
            --card: var(--bg-raised);
            --muted: var(--ink-dim);
            --line: var(--border-soft);
            --accent-dark: var(--accent-dim);
            --playhead: var(--brand-red);
            --track: var(--bg-hover);
            --good: var(--sage);
            --bad: var(--danger);
        }
        @media (prefers-color-scheme: light) {
            :root:not([data-theme="dark"]) {
                --bg: #1C1B1A; --bg-raised: #242321; --bg-hover: #2C2B28;
                --border: #38362f; --border-soft: #2c2b27;
                --ink: #EDEAE3; --ink-dim: #A8A399; --ink-faint: #6f6b62;
            }
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        html { scroll-padding-top: env(safe-area-inset-top, 0px); }
        body {
            font-family: 'IBM Plex Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--ink-dim);
            margin: 0;
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top, 0px));
            padding-bottom: max(20px, env(safe-area-inset-bottom, 0px));
            display: flex;
            justify-content: center;
            min-height: 100%;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }
        ::selection { background: var(--accent-dim); color: #fff; }
        .container {
            background-color: var(--bg-raised);
            border: 1px solid var(--border-soft);
            padding: 28px;
            border-radius: 6px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 880px;
            align-self: flex-start;
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin: 0 0 20px;
            color: var(--ink);
            text-align: center;
        }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; color: var(--ink); }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            background: var(--bg);
            color: var(--ink);
            font-family: inherit;
        }
        input[type="text"]::placeholder { color: var(--ink-faint); }
        input[type="text"]:focus-visible, button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }
        .url-row { display: flex; gap: 10px; align-items: flex-end; }
        .url-row .grow { flex: 1; }

        button {
            font: inherit;
            font-size: 13.5px;
            padding: 8px 14px;
            border: 1px solid var(--border);
            background: none;
            color: var(--ink-dim);
            border-radius: var(--radius);
            cursor: pointer;
            transition: color 0.18s ease, border-color 0.18s ease, background-color 0.18s ease;
        }
        button:hover { color: var(--ink); background: var(--bg-hover); }
        button.primary {
            background: var(--brand-red-dim);
            border-color: var(--brand-red-dim);
            color: #fff;
            font-weight: 500;
        }
        button.primary:hover { background: var(--brand-red); border-color: var(--brand-red); }
        button:disabled { opacity: .4; cursor: default; }

        .msg {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: var(--radius);
            background: rgba(201,161,92,.1);
            border: 1px solid rgba(201,161,92,.35);
            color: var(--ink-dim);
            font-size: 13px;
            line-height: 1.45;
            display: none;
        }
        .msg code { background: rgba(255,255,255,.08); color: var(--ink); padding: 1px 4px; border-radius: 3px; font-family: 'IBM Plex Mono', monospace; }

        /* Player */
        .player-box {
            margin-top: 18px;
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .player-box iframe { width: 100%; height: 100%; display: block; }
        .placeholder {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            color: var(--ink-faint); font-size: 14px; text-align: center; padding: 20px;
            pointer-events: none;
        }

        /* Timeline */
        .timeline-wrap { margin-top: 20px; padding: 0 10px; user-select: none; -webkit-user-select: none; }
        .ruler { position: relative; height: 22px; font-size: 11px; color: var(--ink-faint); font-family: 'IBM Plex Mono', monospace; }
        .tick {
            position: absolute; top: 0; height: 100%;
            border-left: 1px solid var(--border);
            padding-left: 3px; white-space: nowrap;
        }
        .track {
            position: relative;
            height: 64px;
            background: var(--bg-hover);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            cursor: crosshair;
            touch-action: none;
        }
        .track.disabled { opacity: .5; pointer-events: none; }
        .range {
            position: absolute; top: 0; bottom: 0;
            background: rgba(124, 147, 204, .22);
            border-top: 3px solid var(--accent);
            border-bottom: 3px solid var(--accent);
            pointer-events: none;
        }
        .handle {
            position: absolute; top: -5px; bottom: -5px;
            width: 14px; margin-left: -7px;
            background: var(--accent);
            border-radius: var(--radius);
            cursor: ew-resize;
            touch-action: none;
            z-index: 3;
        }
        .handle::after {
            content: ""; position: absolute; left: 50%; top: 22%; bottom: 22%;
            width: 2px; margin-left: -1px; background: rgba(255,255,255,.8); border-radius: 1px;
        }
        .handle:hover, .handle.dragging { background: var(--accent-dim); }
        .handle .tip {
            position: absolute; bottom: calc(100% + 4px); left: 50%;
            transform: translateX(-50%);
            background: var(--bg); color: var(--ink);
            border: 1px solid var(--border);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px; padding: 2px 6px; border-radius: 3px;
            white-space: nowrap; display: none; pointer-events: none;
        }
        .handle:hover .tip, .handle.dragging .tip { display: block; }
        .playhead {
            position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px;
            background: var(--brand-red);
            pointer-events: none; z-index: 2;
        }
        .overview {
            position: relative; height: 16px; margin-top: 12px;
            background: var(--bg-hover); border: 1px solid var(--border-soft); border-radius: 4px;
            touch-action: none; cursor: pointer;
        }
        .ov-cut { position: absolute; top: 0; bottom: 0; background: var(--accent); opacity: .7; min-width: 2px; }
        .ov-play { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--brand-red); }
        .ov-view {
            position: absolute; top: -3px; bottom: -3px;
            border: 2px solid var(--ink-faint); border-radius: 4px;
            background: rgba(255,255,255,.04);
            cursor: grab; min-width: 10px;
        }
        .ov-view.dragging { cursor: grabbing; }
        .tl-hint { font-size: 12px; color: var(--ink-faint); margin-top: 8px; }

        /* Controls */
        .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; }
        .row .spacer { flex: 1; }
        .check { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 400; margin: 0; color: var(--ink-dim); }
        .check input { margin: 0; accent-color: var(--accent); }

        .time-inputs { display: flex; gap: 20px; margin-top: 18px; flex-wrap: wrap; }
        .time-inputs .col { flex: 1; min-width: 260px; }
        .time-inputs .btns { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
        .time-inputs .btns button { padding: 4px 8px; font-size: 12px; font-family: 'IBM Plex Mono', monospace; }
        .hint { font-size: 12px; color: var(--ink-faint); margin-top: 4px; line-height: 1.4; }
        .duration { font-size: 13px; color: var(--ink-faint); margin-top: 14px; font-family: 'IBM Plex Mono', monospace; }
        .duration strong { color: var(--ink); }

        /* Clip maker */
        .make-box {
            margin-top: 22px;
            padding: 18px;
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            background: var(--bg);
        }
        #makeBtn { width: 100%; padding: 14px; font-size: 15px; }
        .bar {
            display: none;
            margin-top: 14px;
            height: 10px;
            background: var(--bg-hover);
            border: 1px solid var(--border-soft);
            border-radius: 5px;
            overflow: hidden;
        }
        .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
        .bar.indeterminate > div { width: 40%; animation: slide 1.1s infinite ease-in-out; }
        @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
        .status { margin-top: 10px; font-size: 13.5px; min-height: 20px; color: var(--ink-dim); }
        .status.err { color: var(--danger); }
        .status.ok { color: var(--sage); }
        .result { display: none; margin-top: 12px; }
        .result a.dl {
            display: block; text-align: center; text-decoration: none;
            background: var(--sage); color: #16210f; font-weight: 600;
            padding: 14px; border-radius: var(--radius); font-size: 15px;
            transition: opacity 0.18s ease;
        }
        .result a.dl:hover { opacity: .85; text-decoration: none; }
        .info-line { font-size: 12.5px; color: var(--ink-faint); margin-top: 8px; text-align: center; font-family: 'IBM Plex Mono', monospace; }
        .info-line .warn { color: var(--amber); font-weight: 600; }
        pre.log {
            display: none; margin-top: 10px; padding: 10px;
            background: #141312; color: var(--ink-dim);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow: auto;
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>YouTube Clip Editor</h1>

    <div class="url-row" style="margin-bottom:14px">
        <div class="grow">
            <label for="apiBase">Server address</label>
            <input type="text" id="apiBase" placeholder="https://a1-backend.tail1b131d.ts.net/clips" autocomplete="off" spellcheck="false">
        </div>
    </div>
    <div class="msg" id="apiMsg" style="background:rgba(124,147,204,.1);border-color:rgba(124,147,204,.35)"></div>

    <div class="url-row">
        <div class="grow">
            <label for="url">YouTube Video URL</label>
            <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
        </div>
        <button class="primary" id="loadBtn">Load video</button>
    </div>
    <div class="msg" id="msg"></div>

    <div class="player-box">
        <div id="player"></div>
        <div class="placeholder" id="placeholder">Paste a YouTube link and press Load video</div>
    </div>

    <div class="timeline-wrap">
        <div class="ruler" id="ruler"></div>
        <div class="track disabled" id="track">
            <div class="range" id="range"></div>
            <div class="handle" id="hStart" data-which="start"><span class="tip"></span></div>
            <div class="handle" id="hEnd" data-which="end"><span class="tip"></span></div>
            <div class="playhead" id="playhead"></div>
        </div>
        <div class="overview" id="overview">
            <div class="ov-cut" id="ovCut"></div>
            <div class="ov-play" id="ovPlay"></div>
            <div class="ov-view" id="ovView"></div>
        </div>
        <div class="tl-hint">Drag the blue handles to set the cut. Click the track to jump. Scroll to zoom, drag the outlined box in the thin bar to pan.</div>
    </div>

    <div class="row">
        <button id="playBtn" disabled>Play</button>
        <button id="previewBtn" class="primary" disabled>Preview cut</button>
        <label class="check"><input type="checkbox" id="loop" checked> Loop</label>
        <span class="spacer"></span>
        <button id="zoomCutBtn" disabled>Zoom to cut</button>
        <button id="zoomFullBtn" disabled>Full video</button>
    </div>

    <div class="time-inputs">
        <div class="col">
            <label for="start">Start time</label>
            <input type="text" id="start" value="00:00:00">
            <div class="btns">
                <button data-nudge="start" data-d="-1">-1s</button>
                <button data-nudge="start" data-d="-0.1">-0.1</button>
                <button data-nudge="start" data-d="0.1">+0.1</button>
                <button data-nudge="start" data-d="1">+1s</button>
                <button id="setStartNow">Set to current time</button>
            </div>
        </div>
        <div class="col">
            <label for="end">End time</label>
            <input type="text" id="end" value="00:00:30">
            <div class="btns">
                <button data-nudge="end" data-d="-1">-1s</button>
                <button data-nudge="end" data-d="-0.1">-0.1</button>
                <button data-nudge="end" data-d="0.1">+0.1</button>
                <button data-nudge="end" data-d="1">+1s</button>
                <button id="setEndNow">Set to current time</button>
            </div>
        </div>
    </div>
    <div class="duration" id="durationInfo">Clip length: <strong>0:30</strong></div>

    <div class="make-box">
        <label for="filename">File name</label>
        <input type="text" id="filename" placeholder="Leave blank for a generated name" autocomplete="off" spellcheck="false">
        <div class="hint">No extension needed, .mp4 is added for you.</div>

        <div class="row">
            <label class="check"><input type="checkbox" id="precise" checked> Fix frozen start / audio sync (re-encodes at the cut points, slower)</label>
        </div>

        <div style="margin-top:16px">
            <button class="primary" id="makeBtn" disabled>Make clip</button>
        </div>

        <div class="bar" id="bar"><div id="barFill"></div></div>
        <div class="status" id="status"></div>

        <div class="result" id="result">
            <a class="dl" id="dlLink" href="#">Download clip</a>
            <div class="info-line" id="infoLine"></div>
        </div>
        <pre class="log" id="log"></pre>
    </div>
</div>

<script>
(function () {
    const $ = id => document.getElementById(id);
    const MIN_GAP = 0.1;   // smallest allowed clip length in seconds
    const MIN_VIEW = 2;    // smallest zoom window in seconds

    // ---- State ----
    let player = null, apiReady = false, playerReady = false;
    let videoId = null;
    let duration = 0;
    let start = 0, end = 30;
    let viewStart = 0, viewEnd = 30;
    let cur = 0;
    let previewing = false;
    let dragging = null, scrubbing = false, panning = false;
    let pendingStart = null;
    let lastSeek = 0;
    let pollTimer = null;
    let working = false;

    const track = $('track'), overview = $('overview');
    const handles = { start: $('hStart'), end: $('hEnd') };

    // ---- Helpers ----
    const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
    const pad = n => String(n).padStart(2, '0');

    function fmt(sec) {
        sec = Math.max(0, sec);
        const totalMs = Math.round(sec * 1000);
        const ms = totalMs % 1000;
        const s = Math.floor(totalMs / 1000);
        let out = pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60);
        if (ms) out += '.' + String(ms).padStart(3, '0').replace(/0+$/, '');
        return out;
    }
    function fmtShort(sec, showFrac) {
        const totalMs = Math.round(Math.max(0, sec) * 1000);
        const s = Math.floor(totalMs / 1000);
        const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
        let out = h ? h + ':' + pad(m) + ':' + pad(ss) : m + ':' + pad(ss);
        if (showFrac) out += '.' + String(Math.floor((totalMs % 1000) / 100));
        return out;
    }
    function parseTime(str) {
        str = String(str).trim();
        if (!str) return null;
        if (/^\d+(\.\d+)?$/.test(str)) return parseFloat(str);
        const parts = str.split(':');
        if (parts.length > 3) return null;
        let total = 0;
        for (const p of parts) {
            if (!/^\d+(\.\d+)?$/.test(p)) return null;
            total = total * 60 + parseFloat(p);
        }
        return total;
    }
    function parseHms(str) { // "6710s", "6710", "1h51m50s"
        if (!str) return null;
        if (/^\d+$/.test(str)) return parseInt(str, 10);
        const m = str.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/);
        if (!m || (!m[1] && !m[2] && !m[3])) return null;
        return (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0);
    }
    function parseVideo(raw) {
        let id = null, t = null;
        try {
            const u = new URL(raw);
            const host = u.hostname.replace(/^www\./, '');
            if (host === 'youtu.be') id = u.pathname.slice(1).split('/')[0];
            else if (host.endsWith('youtube.com')) {
                id = u.searchParams.get('v');
                const m = u.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]{11})/);
                if (!id && m) id = m[1];
            }
            t = parseHms(u.searchParams.get('t') || u.searchParams.get('start'));
        } catch (e) { /* not a URL */ }
        if (id && !/^[\w-]{11}$/.test(id)) id = null;
        return { id, t };
    }

    function showMsg(html) {
        const el = $('msg');
        if (!html) { el.style.display = 'none'; return; }
        el.innerHTML = html;
        el.style.display = 'block';
    }

    // ---- Timeline geometry ----
    const span = () => viewEnd - viewStart;
    const timeToPct = t => ((t - viewStart) / span()) * 100;
    function xToTime(clientX) {
        const r = track.getBoundingClientRect();
        const f = clamp((clientX - r.left) / r.width, 0, 1);
        return viewStart + f * span();
    }
    function setView(a, b) {
        let s = clamp(b - a, MIN_VIEW, duration);
        a = clamp(a, 0, duration - s);
        viewStart = a; viewEnd = a + s;
    }
    function zoomToCut() {
        const pad2 = Math.max((end - start) * 0.25, 2);
        setView(start - pad2, end + pad2);
        renderStatic();
    }
    function ensureCutVisible() {
        if (start < viewStart || end > viewEnd) zoomToCut();
    }

    // ---- Rendering ----
    function renderStatic() {
        const ready = duration > 0;
        track.classList.toggle('disabled', !ready);
        ['playBtn', 'previewBtn', 'zoomCutBtn', 'zoomFullBtn'].forEach(id => $(id).disabled = !ready);
        $('makeBtn').disabled = !ready || working;

        if (ready) {
            // ruler
            const steps = [0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200];
            const step = steps.find(s => s >= span() / 8) || 7200;
            const ruler = $('ruler');
            ruler.innerHTML = '';
            for (let t = Math.ceil(viewStart / step) * step; t <= viewEnd; t += step) {
                const d = document.createElement('div');
                d.className = 'tick';
                d.style.left = timeToPct(t) + '%';
                d.textContent = fmtShort(t, step < 1);
                ruler.appendChild(d);
            }
            // range + handles (clipped to the visible window)
            const range = $('range');
            const l = clamp(timeToPct(start), 0, 100), r = clamp(timeToPct(end), 0, 100);
            range.style.left = l + '%';
            range.style.width = Math.max(r - l, 0) + '%';
            range.style.display = (end < viewStart || start > viewEnd) ? 'none' : 'block';
            for (const w of ['start', 'end']) {
                const t = w === 'start' ? start : end;
                const h = handles[w];
                h.style.display = (t < viewStart || t > viewEnd) ? 'none' : 'block';
                h.style.left = timeToPct(t) + '%';
                h.querySelector('.tip').textContent = fmt(t);
            }
            // overview
            $('ovCut').style.left = (start / duration * 100) + '%';
            $('ovCut').style.width = ((end - start) / duration * 100) + '%';
            $('ovView').style.left = (viewStart / duration * 100) + '%';
            $('ovView').style.width = ((viewEnd - viewStart) / duration * 100) + '%';
        } else {
            $('ruler').innerHTML = '';
            handles.start.style.display = handles.end.style.display = 'none';
            $('range').style.display = 'none';
            $('ovCut').style.width = '0';
        }

        // inputs (don't overwrite while typing)
        if (document.activeElement !== $('start')) $('start').value = fmt(start);
        if (document.activeElement !== $('end')) $('end').value = fmt(end);
        const len = end - start;
        $('durationInfo').innerHTML = 'Clip length: <strong>' + fmtShort(len, len % 1 !== 0) + '</strong>';

        renderPlayhead();
    }

    function renderPlayhead() {
        const ph = $('playhead');
        if (duration > 0 && cur >= viewStart && cur <= viewEnd) {
            ph.style.display = 'block';
            ph.style.left = timeToPct(cur) + '%';
        } else ph.style.display = 'none';
        $('ovPlay').style.left = duration > 0 ? (cur / duration * 100) + '%' : '0';
    }

    // ---- Player ----
    function loadApi() {
        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);
    }
    window.onYouTubeIframeAPIReady = function () {
        apiReady = true;
        if (videoId) createPlayer();
    };

    function createPlayer() {
        const vars = { rel: 0, playsinline: 1, modestbranding: 1 };
        if (location.protocol.startsWith('http')) vars.origin = location.origin;
        player = new YT.Player('player', {
            videoId: videoId,
            width: '100%', height: '100%',
            playerVars: vars,
            events: {
                onReady: () => {
                    playerReady = true;
                    showMsg('');
                    const d = player.getVideoData && player.getVideoData();
                    if (d && d.video_id !== videoId) player.cueVideoById(videoId);
                },
                onStateChange: onState,
                onError: onPlayerError
            }
        });
    }

    function onState(e) {
        $('playBtn').textContent = (e.data === 1) ? 'Pause' : 'Play';
    }
    function onPlayerError(e) {
        const code = e.data;
        let html = 'The player reported error ' + code + '. ';
        if (code === 153 || location.protocol === 'file:') {
            html += 'YouTube blocks embeds when it can\u2019t see a proper web address for the page. Open this page from the laptop\u2019s address (for example <code>http://192.168.0.245:3100</code>) rather than from a file.';
        } else if (code === 101 || code === 150) {
            html += 'The uploader doesn\u2019t allow this video to be embedded, so the timeline can\u2019t preview it.';
        } else if (code === 100) {
            html += 'The video was not found or is private.';
        } else {
            html += 'Check the link and try again.';
        }
        showMsg(html);
    }

    function loadVideo() {
        showMsg('');
        const { id, t } = parseVideo($('url').value.trim());
        if (!id) { showMsg('That doesn\u2019t look like a YouTube video link. Try a watch, youtu.be or shorts URL.'); return; }
        videoId = id;
        duration = 0;
        previewing = false;
        pendingStart = t;
        resetResult();
        $('placeholder').style.display = 'none';
        if (player && playerReady) player.cueVideoById(id);
        else if (apiReady && !player) createPlayer();
        else if (!apiReady) showMsg('Still loading the YouTube player, it will start as soon as it is ready.');
        renderStatic();
    }

    function initFromDuration(d) {
        duration = d;
        const s = pendingStart != null ? pendingStart : 0;
        start = clamp(s, 0, Math.max(d - MIN_GAP, 0));
        end = clamp(start + 30, start + MIN_GAP, d);
        viewStart = 0; viewEnd = d;
        const hadStart = pendingStart != null;
        pendingStart = null;
        if (hadStart) zoomToCut(); else renderStatic();
        if (!hadStart && start > 0) player.seekTo(start, true);
    }

    // ---- Seeking ----
    function seek(t, allowAhead) {
        if (!player || !playerReady) return;
        cur = t;
        player.seekTo(t, allowAhead !== false);
        renderPlayhead();
    }
    function seekThrottled(t) {
        const now = performance.now();
        cur = t; renderPlayhead();
        if (now - lastSeek > 90) { lastSeek = now; player.seekTo(t, false); }
    }
    function pausePlayer() { if (player && playerReady) player.pauseVideo(); }

    // ---- Polling loop ----
    setInterval(function () {
        if (!player || !playerReady || typeof player.getCurrentTime !== 'function') return;
        if (duration <= 0) {
            const d = player.getDuration();
            if (d > 0) initFromDuration(d);
            return;
        }
        if (!dragging && !scrubbing) cur = player.getCurrentTime();
        if (previewing && player.getPlayerState() === 1 && cur >= end) {
            if ($('loop').checked) seek(start);
            else { player.pauseVideo(); previewing = false; seek(end); }
        }
        renderPlayhead();
    }, 100);

    // ---- Handle dragging ----
    ['start', 'end'].forEach(which => {
        const h = handles[which];
        h.addEventListener('pointerdown', e => {
            if (!duration) return;
            e.preventDefault(); e.stopPropagation();
            dragging = which;
            h.classList.add('dragging');
            h.setPointerCapture(e.pointerId);
            pausePlayer();
            previewing = false;
        });
        h.addEventListener('pointermove', e => {
            if (dragging !== which) return;
            const t = xToTime(e.clientX);
            if (which === 'start') start = clamp(t, 0, end - MIN_GAP);
            else end = clamp(t, start + MIN_GAP, duration);
            renderStatic();
            seekThrottled(which === 'start' ? start : end);
        });
        const finish = () => {
            if (dragging !== which) return;
            dragging = null;
            h.classList.remove('dragging');
            seek(which === 'start' ? start : end, true);
        };
        h.addEventListener('pointerup', finish);
        h.addEventListener('pointercancel', finish);
    });

    // ---- Scrub on track ----
    track.addEventListener('pointerdown', e => {
        if (!duration || e.target.closest('.handle')) return;
        scrubbing = true;
        previewing = false;
        track.setPointerCapture(e.pointerId);
        seekThrottled(xToTime(e.clientX));
    });
    track.addEventListener('pointermove', e => { if (scrubbing) seekThrottled(xToTime(e.clientX)); });
    const endScrub = e => { if (!scrubbing) return; scrubbing = false; seek(xToTime(e.clientX), true); };
    track.addEventListener('pointerup', endScrub);
    track.addEventListener('pointercancel', () => { scrubbing = false; });

    // ---- Zoom with wheel ----
    track.addEventListener('wheel', e => {
        if (!duration) return;
        e.preventDefault();
        const r = track.getBoundingClientRect();
        const f = clamp((e.clientX - r.left) / r.width, 0, 1);
        const pivot = viewStart + f * span();
        const factor = e.deltaY < 0 ? 0.8 : 1.25;
        const newSpan = clamp(span() * factor, MIN_VIEW, duration);
        setView(pivot - f * newSpan, pivot - f * newSpan + newSpan);
        renderStatic();
    }, { passive: false });

    // ---- Overview: pan the zoom window ----
    let panOffset = 0;
    function ovTime(clientX) {
        const r = overview.getBoundingClientRect();
        return clamp((clientX - r.left) / r.width, 0, 1) * duration;
    }
    overview.addEventListener('pointerdown', e => {
        if (!duration) return;
        const t = ovTime(e.clientX);
        const inside = t >= viewStart && t <= viewEnd;
        panOffset = inside ? t - viewStart : span() / 2;
        panning = true;
        $('ovView').classList.add('dragging');
        overview.setPointerCapture(e.pointerId);
        setView(t - panOffset, t - panOffset + span());
        renderStatic();
    });
    overview.addEventListener('pointermove', e => {
        if (!panning) return;
        const t = ovTime(e.clientX);
        setView(t - panOffset, t - panOffset + span());
        renderStatic();
    });
    const endPan = () => { panning = false; $('ovView').classList.remove('dragging'); };
    overview.addEventListener('pointerup', endPan);
    overview.addEventListener('pointercancel', endPan);

    // ---- Buttons ----
    $('loadBtn').addEventListener('click', loadVideo);
    $('url').addEventListener('keydown', e => { if (e.key === 'Enter') loadVideo(); });
    $('url').addEventListener('paste', () => setTimeout(loadVideo, 0));

    $('playBtn').addEventListener('click', () => {
        if (!player) return;
        previewing = false;
        player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo();
    });
    $('previewBtn').addEventListener('click', () => {
        if (!player || !duration) return;
        seek(start);
        player.playVideo();
        previewing = true;
    });
    $('zoomCutBtn').addEventListener('click', zoomToCut);
    $('zoomFullBtn').addEventListener('click', () => { setView(0, duration); renderStatic(); });

    $('setStartNow').addEventListener('click', () => {
        if (!duration) return;
        start = clamp(cur, 0, end - MIN_GAP);
        ensureCutVisible(); renderStatic();
    });
    $('setEndNow').addEventListener('click', () => {
        if (!duration) return;
        end = clamp(cur, start + MIN_GAP, duration);
        ensureCutVisible(); renderStatic();
    });

    document.querySelectorAll('[data-nudge]').forEach(b => {
        b.addEventListener('click', () => {
            if (!duration) return;
            const which = b.dataset.nudge, d = parseFloat(b.dataset.d);
            if (which === 'start') start = clamp(start + d, 0, end - MIN_GAP);
            else end = clamp(end + d, start + MIN_GAP, duration);
            previewing = false;
            pausePlayer();
            seek(which === 'start' ? start : end);
            ensureCutVisible(); renderStatic();
        });
    });

    // typed times
    function applyTyped(which) {
        const el = $(which);
        const t = parseTime(el.value);
        if (t != null) {
            const max = duration || Infinity;
            if (which === 'start') start = clamp(t, 0, Math.min(end - MIN_GAP, max));
            else end = clamp(t, start + MIN_GAP, max);
            if (duration) { seek(which === 'start' ? start : end); ensureCutVisible(); }
        }
        el.value = fmt(which === 'start' ? start : end);
        renderStatic();
    }
    ['start', 'end'].forEach(w => {
        $(w).addEventListener('change', () => applyTyped(w));
        $(w).addEventListener('keydown', e => { if (e.key === 'Enter') { applyTyped(w); $(w).blur(); } });
    });

    // ---- Making the clip (talks to the server on the laptop) ----
    function setStatus(text, cls) {
        const el = $('status');
        el.textContent = text;
        el.className = 'status' + (cls ? ' ' + cls : '');
    }
    function resetResult() {
        clearTimeout(pollTimer);
        working = false;
        $('bar').style.display = 'none';
        $('bar').classList.remove('indeterminate');
        $('barFill').style.width = '0';
        $('result').style.display = 'none';
        $('log').style.display = 'none';
        setStatus('');
    }
    function setBar(pct, indeterminate) {
        const bar = $('bar');
        bar.style.display = 'block';
        bar.classList.toggle('indeterminate', !!indeterminate);
        $('barFill').style.width = indeterminate ? '' : pct + '%';
    }
    function fail(text, log) {
        working = false;
        $('bar').style.display = 'none';
        setStatus(text, 'err');
        if (log) { $('log').textContent = log; $('log').style.display = 'block'; }
        renderStatic();
    }

    function apiBase() {
        return $('apiBase').value.trim().replace(/\/+$/, '');
    }
    function apiUrl(path) {
        const base = apiBase();
        // Same-origin fallback: if this page is itself served by the clip
        // server (e.g. opened straight from the laptop), a blank address
        // still works via relative paths.
        return base ? base + path : path;
    }

    async function makeClip() {
        if (!videoId || !duration || working) return;
        if (!apiBase() && location.hostname.endsWith('github.io')) {
            return fail('Enter the server address above first (the tunnel URL).');
        }
        resetResult();
        working = true;
        renderStatic();
        setStatus('Sending to the server...');
        setBar(0, true);
        try {
            const res = await fetch(apiUrl('/api/jobs'), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    videoId, start, end,
                    filename: $('filename').value,
                    precise: $('precise').checked
                })
            });
            const data = await res.json();
            if (!res.ok) return fail(data.error || 'The server refused that request.');
            poll(data.id);
        } catch (e) {
            fail('Could not reach the server. Check the server address above and that it\u2019s running.');
        }
    }

    async function poll(id) {
        try {
            const res = await fetch(apiUrl('/api/jobs/' + id));
            if (!res.ok) return fail('The server lost track of that job. Try again.');
            const j = await res.json();

            if (j.status === 'queued') {
                setStatus('Waiting in the queue' + (j.queuePosition ? ' (position ' + j.queuePosition + ')' : '') + '...');
                setBar(0, true);
            } else if (j.status === 'running') {
                if (j.progress > 0 && j.progress < 99) {
                    setStatus(Math.round(j.progress) + '% downloaded');
                    setBar(j.progress, false);
                } else {
                    setStatus(j.stage || 'Working...');
                    setBar(100, true);
                }
            } else if (j.status === 'done') {
                working = false;
                setBar(100, false);
                setStatus('Clip ready.', 'ok');
                showResult(j);
                renderStatic();
                return;
            } else if (j.status === 'error') {
                return fail((j.error || 'Something went wrong.') + ' Details below.', j.log);
            }
        } catch (e) {
            return fail('Lost contact with the server.');
        }
        pollTimer = setTimeout(() => poll(id), 1000);
    }

    function showResult(j) {
        const link = $('dlLink');
        link.href = apiUrl('/downloads/' + encodeURIComponent(j.file));
        link.setAttribute('download', j.downloadName || '');
        link.textContent = 'Download ' + (j.downloadName || 'clip');
        $('result').style.display = 'block';

        const i = j.info;
        if (!i) { $('infoLine').textContent = ''; return; }
        const fps = i.fps != null ? i.fps : '?';
        const codec = String(i.codec || '?').toUpperCase();
        let html = i.width + '\u00d7' + i.height + ' \u00b7 ' + fps + ' fps \u00b7 ' + codec;
        if (i.fps != null && i.fps < 50) html += ' <span class="warn">(not 60 fps, the source video may not offer it)</span>';
        else if (i.codec !== 'h264') html += ' <span class="warn">(not H.264, some players may struggle)</span>';
        $('infoLine').innerHTML = html;
    }

    $('makeBtn').addEventListener('click', makeClip);

    // ---- Server address ----
    // Fixed address (Tailscale Funnel, doesn't change on restart). A
    // ?api=... in the URL or a manually typed value can still override it
    // for testing, and either gets remembered for next time.
    const DEFAULT_API_BASE = 'https://a1-backend.tail1b131d.ts.net/clips';
    (function initApiBase() {
        let fromUrl = null;
        try { fromUrl = new URLSearchParams(location.search).get('api'); } catch (e) { /* ignore */ }
        if (fromUrl) {
            $('apiBase').value = fromUrl;
            try { localStorage.setItem('clip-api-base', fromUrl.trim()); } catch (e) { /* ignore */ }
            return;
        }
        let saved = null;
        try { saved = localStorage.getItem('clip-api-base'); } catch (e) { /* storage unavailable */ }
        $('apiBase').value = saved || DEFAULT_API_BASE;
    })();
    $('apiBase').addEventListener('input', () => {
        try { localStorage.setItem('clip-api-base', $('apiBase').value.trim()); } catch (e) { /* ignore */ }
    });
    document.getElementById('apiMsg').style.display = 'none';

 //BOOT
    loadApi();
    renderStatic();
})();
</script>

</body>
</html>

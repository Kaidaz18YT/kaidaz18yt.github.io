<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger — Connection Test</title>
<style>
  :root{
    --bg:#1C1B1A; --bg-raised:#242321; --border:#38362f;
    --ink:#EDEAE3; --ink-dim:#A8A399; --ink-faint:#6f6b62;
    --amber:#C9A15C; --sage:#8FA184; --danger:#C97C6E; --accent:#7C93CC;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background:var(--bg); color:var(--ink);
    font-family: -apple-system, system-ui, sans-serif;
    padding: env(safe-area-inset-top,0) 16px calc(40px + env(safe-area-inset-bottom,0));
    font-size: 15px; line-height:1.5;
  }
  h1{ font-size:20px; margin: 20px 0 4px; }
  .sub{ color:var(--ink-dim); font-size:13.5px; margin-bottom:20px; }
  .sub a{ color:var(--accent); }
  .rerun{
    background: var(--accent); color:#0d0d0c; border:none; font-weight:600;
    padding:10px 16px; border-radius:6px; font-size:14px; margin-bottom:18px;
  }
  .test{
    background: var(--bg-raised); border:1px solid var(--border); border-radius:8px;
    padding:14px 16px; margin-bottom:10px;
  }
  .row{ display:flex; align-items:center; gap:10px; }
  .dot{
    width:11px; height:11px; border-radius:50%; flex-shrink:0;
    background: var(--ink-faint);
  }
  .dot.pass{ background: var(--sage); }
  .dot.fail{ background: var(--danger); }
  .dot.pending{ background: var(--amber); animation: pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.4} }
  .name{ font-weight:600; font-size:14.5px; flex:1; }
  .status{ font-size:12.5px; color:var(--ink-faint); font-family: ui-monospace, monospace; }
  .detail{
    margin-top:8px; padding-top:8px; border-top:1px solid var(--border);
    font-size:13px; color:var(--ink-dim); white-space:pre-wrap; word-break:break-word;
    display:none;
  }
  .detail.show{ display:block; }
  .hint{
    margin-top:8px; font-size:13px; color:var(--amber); display:none;
  }
  .hint.show{ display:block; }
  .summary{
    margin-top: 20px; padding: 14px 16px; border-radius:8px;
    background: var(--bg-raised); border:1px solid var(--border); font-size:14px;
  }
</style>
</head>
<body>
<h1>Ledger — Connection Test</h1>
<div class="sub">Checks the BreadBackend SDK, API and browser storage. Run this on the device and network where Ledger is failing. If the SDK check fails, <a href="https://kaidaz18.duckdns.org/sdk/bread-client.js" target="_blank" rel="noopener">open the SDK URL</a> in Safari; you should see JavaScript, not a certificate warning.<br><span id="test-context"></span> · <a href="../">Back to Ledger</a></div>
<button class="rerun" id="rerun">Run tests again</button>

<div id="tests"></div>
<div class="summary" id="summary"></div>

<script>
const $ = (s,el=document)=>el.querySelector(s);
const BASE = 'https://kaidaz18.duckdns.org/api/v1/kaidaz18-notes';
const API_KEY = 'pk_live_BpZSqs73ax25L4X91Ok0D3fY';
const SDK = 'https://kaidaz18.duckdns.org/sdk/bread-client.js';
const standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
$('#test-context').textContent = standalone ? 'Running in the home-screen app' : 'Running in a browser tab';

async function fetchWithTimeout(url, options = {}){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 12000);
  try { return await fetch(url, { ...options, signal: controller.signal, cache: 'no-store' }); }
  finally { clearTimeout(timer); }
}
function loadSdk(){
  if (typeof window.BreadClient === 'function' || typeof BreadClient === 'function') return Promise.resolve();
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    let timer;
    const finish = (error) => {
      clearTimeout(timer);
      script.remove();
      if (error) reject(error); else resolve();
    };
    timer = setTimeout(() => finish(new Error('Timed out loading the SDK.')), 12000);
    script.onload = () => finish(typeof window.BreadClient === 'function' || typeof BreadClient === 'function' ? null : new Error('The script did not provide BreadClient.'));
    script.onerror = () => finish(new Error('Could not load the BreadBackend SDK.'));
    script.src = SDK;
    document.head.appendChild(script);
  });
}

const TESTS = [
  {
    id: 'sdk', name: 'BreadBackend JavaScript SDK',
    run: async () => {
      await loadSdk();
      return { detail: 'The SDK loaded and exposes BreadClient.' };
    },
    hint: 'Open the SDK URL above in Safari and compare Wi-Fi with mobile data. A network, DNS, server, content blocker, certificate, or unsupported SDK syntax can prevent it loading. Never bypass a certificate warning.'
  },
  {
    id: 'api', name: 'Project collections API and browser CORS',
    run: async () => {
      const r = await fetchWithTimeout(BASE + '/collections/notes', { headers: { 'x-api-key': API_KEY } });
      if (r.status === 401 || r.status === 403) return { detail: `The API responded (HTTP ${r.status}); authentication or project rules are required. Sign in and verify the rules before using Ledger.` };
      if (!r.ok) throw new Error(`HTTP ${r.status}. Check the project slug, API key and collection rules.`);
      return { detail: `The project API responded (HTTP ${r.status}) and this browser can make cross-origin requests. No note contents were displayed.` };
    },
    hint: 'A network error can mean the server is unreachable, its HTTPS certificate is invalid, or CORS does not allow this site and the x-api-key/Authorization headers. Check the server and browser console.'
  },
  {
    id: 'auth', name: 'BreadBackend session endpoint',
    run: async () => {
      const r = await fetchWithTimeout(BASE + '/auth/me', { headers: { 'x-api-key': API_KEY } });
      if (r.status === 401 || r.status === 403) return { detail: `The endpoint responded (HTTP ${r.status}) without a session, as expected for a protected profile.` };
      if (!r.ok) throw new Error(`HTTP ${r.status}. The session endpoint did not respond as expected.`);
      return { detail: `The endpoint responded (HTTP ${r.status}). This check does not verify an account or expose profile data.` };
    },
    hint: 'Verify that the project auth endpoint is enabled and that the server allows this site and the required request headers in its CORS configuration.'
  },
  {
    id: 'storage', name: 'Browser local storage',
    run: async () => {
      const key = '__ledger_test__';
      localStorage.setItem(key, '1');
      const value = localStorage.getItem(key);
      localStorage.removeItem(key);
      if (value !== '1') throw new Error('Could not read back the test value.');
      return { detail: 'Local storage works. Ledger uses it to keep your BreadBackend session between reloads and tabs.' };
    },
    hint: 'Check the browser’s storage and privacy settings. Without local storage, you may need to sign in again after reloading.'
  },
  {
    id: 'https', name: 'Secure page',
    run: async () => {
      if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') throw new Error('This page is using ' + location.protocol + '.');
      return { detail: 'The page is using HTTPS or a local development address.' };
    },
    hint: 'Open the published site over HTTPS to protect your session and avoid browser security restrictions.'
  },
];

let summaryEl, testsEl;
function renderShell(){
  testsEl = $('#tests');
  testsEl.innerHTML = TESTS.map(t => `
    <div class="test" id="t-${t.id}">
      <div class="row">
        <div class="dot pending" id="dot-${t.id}"></div>
        <div class="name">${t.name}</div>
        <div class="status" id="status-${t.id}">running…</div>
      </div>
      <div class="detail" id="detail-${t.id}"></div>
      <div class="hint" id="hint-${t.id}">${t.hint || ''}</div>
    </div>`).join('');
  summaryEl = $('#summary');
  summaryEl.textContent = 'Running tests…';
}
async function runAll(){
  $('#rerun').disabled = true;
  renderShell();
  let passCount = 0, failCount = 0;
  for (const t of TESTS) {
    const dot = $('#dot-' + t.id), status = $('#status-' + t.id);
    const detail = $('#detail-' + t.id), hint = $('#hint-' + t.id);
    try {
      const res = await t.run();
      dot.className = 'dot pass'; status.textContent = 'OK';
      detail.textContent = res.detail || ''; detail.classList.add('show'); passCount++;
    } catch (err) {
      dot.className = 'dot fail'; status.textContent = 'FAILED';
      detail.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
      detail.classList.add('show'); hint.classList.add('show'); failCount++;
    }
  }
  summaryEl.textContent = failCount === 0
    ? `All ${passCount} checks passed. Signing in and accessing your own documents also depends on account and project rules.`
    : `${failCount} of ${TESTS.length} checks failed. See the notes above for what to check.`;
  $('#rerun').disabled = false;
}
$('#rerun').addEventListener('click', runAll);
runAll();
</script>
</body>
</html>

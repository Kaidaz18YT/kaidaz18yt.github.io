<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Private area: keep this page out of search engines. -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger — Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #171615;
    --bg-raised: #201F1D;
    --border: #322F29;
    --ink: #EDEAE3;
    --ink-dim: #A8A399;
    --ink-faint: #6f6b62;
    --accent: #7C93CC;
    --amber: #C9A15C;
    --sage: #8FA184;
    --danger: #C97C6E;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
  }
  input, button { font-family: inherit; color: inherit; }

  #login-screen {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    z-index: 100;
  }
  #login-screen.hidden { display: none; }
  .login-box { width: 300px; padding: 0 8px; }
  .login-box h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .login-box p { color: var(--ink-dim); font-size: 13px; margin: 0 0 24px; }
  .login-box input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 3px; background: var(--bg-raised); margin-bottom: 10px; font-size: 14px;
    outline: none;
  }
  .login-box input:focus { border-color: var(--accent); }
  .login-box button {
    width: 100%; padding: 10px 12px; background: #4A5D8A; color: #fff;
    border: none; border-radius: 3px; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .login-error { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 16px; }
  .login-box a { display: block; margin-top: 14px; font-size: 13px; color: var(--accent); }
  .login-box .retry-session { background: none; color: var(--accent); padding: 8px 0; font-size: 13px; }
  #sync-notice { background: #33261A; border: 1px solid #6B5233; padding: 10px 12px; margin-bottom: 16px; font-size: 13px; }
  #sync-notice button { background: none; border: none; color: var(--accent); text-decoration: underline; cursor: pointer; }
  #live-dot.stale { background: var(--danger); animation: none; }
  .sync-caption { color: var(--ink-faint); font-size: 11px; margin-top: 3px; }

  #board {
    display: none;
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 24px 60px;
    min-height: 100vh;
  }
  #board.visible { display: block; }

  #board-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  #board-head h1 {
    font-size: 22px;
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  #board-head h1::before {
    content: '';
    display: inline-block;
    width: 9px; height: 9px;
    background: var(--amber);
    margin-right: 10px;
    border-radius: 1px;
  }
  #clock {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink-faint);
    font-size: 13px;
  }
  #live-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--sage);
    margin-right: 6px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .col-label {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-faint);
    margin: 28px 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .col-label:first-of-type { margin-top: 0; }
  .col-label .n { font-family: 'IBM Plex Mono', monospace; color: var(--ink-dim); }

  .row {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 13px 4px;
    border-bottom: 1px solid var(--border);
    border-left: 3px solid transparent;
  }
  .row.p-urgent { border-left-color: var(--danger); }
  .row.p-high { border-left-color: var(--amber); }
  .row.p-medium { border-left-color: var(--accent); }
  .row.p-low { border-left-color: var(--border); }

  .row-title { font-size: 16px; font-weight: 500; }
  .row-meta {
    display: flex;
    gap: 16px;
    margin-top: 4px;
    font-size: 13px;
    color: var(--ink-faint);
    flex-wrap: wrap;
  }
  .row-meta .deadline { font-family: 'IBM Plex Mono', monospace; }
  .row-meta .deadline.overdue { color: var(--danger); font-weight: 500; }
  .row-meta .deadline.soon { color: var(--amber); font-weight: 500; }
  .row-meta .priority-word { font-weight: 500; }
  .row-meta .priority-word.p-urgent { color: var(--danger); }
  .row-meta .priority-word.p-high { color: var(--amber); }
  .row-meta .project-tag { display: flex; align-items: center; gap: 6px; }
  .row-meta .dot { width: 6px; height: 6px; border-radius: 50%; }

  .empty {
    color: var(--ink-faint);
    font-size: 14px;
    padding: 30px 4px;
    text-align: center;
  }

  #signout {
    position: fixed;
    bottom: 16px;
    right: 16px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    color: var(--ink-faint);
    padding: 7px 12px;
    border-radius: 3px;
    font-size: 12px;
    cursor: pointer;
  }
  #signout:hover { color: var(--ink); }

  @media (max-width: 600px) {
    #board { padding: 20px 16px 60px; }
    #board-head { flex-direction: column; align-items: flex-start; gap: 6px; }
    .row-title { font-size: 15px; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <form class="login-box" id="auth-form">
    <h1>Ledger — Board</h1>
    <p>Enter your password to continue.</p>
    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" aria-label="Password" required>
    <button id="login-btn" type="submit">Sign in</button>
    <button id="login-retry" class="retry-session" type="button" hidden>Retry saved session</button>
    <div class="login-error" id="login-error" role="status"></div>
    <a href="../">Open Ledger</a>
    <a href="../test/">Run connection test</a>
  </form>
</div>

<div id="board">
  <div id="board-head">
    <h1>What's due</h1>
    <div><div id="clock"><span id="live-dot"></span><span id="clock-text"></span></div><div class="sync-caption">Refreshes every 30 seconds</div></div>
  </div>
  <div id="sync-notice" role="status" hidden><span id="sync-message"></span> <button id="sync-retry" type="button">Retry</button></div>
  <div id="list"></div>
</div>

<button id="signout" hidden>Sign out</button>

<script src="../bread-backend.js"></script>
<script>
const backend = window.LedgerBackend;
const $ = (id) => document.getElementById(id);

let tasks = [];
let projects = [];
const PROJECT_COLORS = ['#7C93CC','#C9A15C','#8FA184','#C97C6E','#B490C0','#6FB3B8','#D0A868','#9AAF6E'];
function colorForIndex(i){ return PROJECT_COLORS[i % PROJECT_COLORS.length]; }
function safeProjectColor(value, fallback){ return /^#[0-9a-f]{6}$/i.test(String(value || '')) ? value : fallback; }
function projectColor(id){
  const idx = projects.findIndex(p=>p.id===id);
  if (idx===-1) return null;
  return safeProjectColor(projects[idx].color, colorForIndex(idx));
}
function projectName(id){
  const p = projects.find(p=>p.id===id);
  return p ? p.name : null;
}

let epoch = 0;
let authAttempt = 0;
let pollTimer = null;
let clockTimer = null;
let syncPromise = null;
let syncAgain = false;
let subscriptions = [];
let dataReady = false;

function stopSubscriptions(){
  subscriptions.splice(0).forEach(unsubscribe => { try { unsubscribe(); } catch (error) { console.warn(error); } });
  syncAgain = false;
}
function queueSync(){
  if (!backend.user) return;
  if (syncPromise) syncAgain = true;
  else syncData();
}
function startSubscriptions(){
  const requestEpoch = epoch;
  ['tasks', 'projects'].forEach(async name => {
    try {
      const unsubscribe = await backend.subscribe(name, queueSync);
      if (requestEpoch !== epoch) { if (unsubscribe) unsubscribe(); return; }
      if (unsubscribe) subscriptions.push(unsubscribe);
    } catch (error) { if (requestEpoch === epoch) console.warn('Cross-tab updates unavailable for ' + name, error); }
  });
}
function stopBoard(){
  stopSubscriptions();
  epoch++;
  authAttempt++;
  clearInterval(pollTimer); clearInterval(clockTimer);
  pollTimer = null; clockTimer = null; syncPromise = null;
  tasks = []; projects = []; dataReady = false;
  $('list').innerHTML = '';
  $('board').classList.remove('visible');
  $('signout').hidden = true;
}
function showBoard(){
  epoch++;
  dataReady = false;
  $('login-screen').classList.add('hidden');
  $('board').classList.add('visible');
  $('signout').hidden = false;
  $('sync-notice').hidden = true;
  $('list').innerHTML = '<div class="empty">Loading your board…</div>';
  clearInterval(pollTimer); clearInterval(clockTimer);
  stopSubscriptions();
  startClock();
  syncData();
  startSubscriptions();
  pollTimer = setInterval(() => { if (!document.hidden) syncData(); }, 30000);
}
function showLogin(message){
  $('login-screen').classList.remove('hidden');
  $('board').classList.remove('visible');
  $('signout').hidden = true;
  $('login-password').value = '';
  $('login-retry').hidden = !backend.hasSession;
  $('login-error').textContent = message || '';
}
async function restoreSession(){
  if (!backend.hasSession) { showLogin(); return; }
  const attempt = ++authAttempt;
  $('login-error').textContent = 'Checking your saved session…';
  $('login-retry').hidden = true;
  try {
    await backend.restore();
    if (attempt === authAttempt) showBoard();
  } catch(error) {
    if (attempt !== authAttempt) return;
    console.error(error);
    if (backend.isAccountError(error) || backend.isSdkError(error)) showLogin(error.message);
    else if (backend.isUnauthorized(error)) {
      try { await backend.logout(); } catch (logoutError) { console.warn(logoutError); }
      if (attempt === authAttempt) showLogin('Your session has expired. Please sign in again.');
    } else showLogin('Could not restore your session. Check the connection and retry, or sign in again.');
  }
}
$('auth-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const attempt = ++authAttempt;
  $('login-btn').disabled = true; $('login-retry').disabled = true;
  $('login-error').textContent = 'Signing in…';
  try {
    await backend.login($('login-password').value);
    if (attempt !== authAttempt) return;
    $('login-password').value = '';
    showBoard();
  } catch(error) {
    if (attempt !== authAttempt) return;
    console.error(error);
    const status = backend.statusOf(error);
    $('login-error').textContent = backend.isAccountError(error) || backend.isSdkError(error) ? error.message
      : status === 400 || status === 403 || backend.isUnauthorized(error)
        ? 'Could not sign in. Check your password and account status.'
        : 'Could not reach BreadBackend. Check the connection and server settings, then try again.';
    $('login-retry').hidden = !backend.hasSession;
  } finally { $('login-btn').disabled = false; $('login-retry').disabled = false; }
});
$('login-retry').addEventListener('click', restoreSession);
$('signout').addEventListener('click', async () => {
  const attempt = ++authAttempt;
  $('signout').disabled = true;
  let failed = false;
  try { await backend.logout(); } catch (error) { console.warn(error); failed = true; }
  finally { $('signout').disabled = false; }
  if (attempt !== authAttempt) return;
  stopBoard();
  showLogin(failed ? 'Signed out locally. Server sign-out could not be confirmed.' : 'Signed out.');
});
window.addEventListener('ledger-session-change', () => {
  stopBoard();
  if (backend.hasSession) restoreSession(); else showLogin('Signed out in another tab.');
});

async function syncData(){
  if (!backend.user) return;
  if (syncPromise) return syncPromise;
  const requestEpoch = epoch;
  const revision = backend.revision;
  const promise = (async () => {
    try {
      const [nextTasks, nextProjects] = await Promise.all([backend.list('tasks'), backend.list('projects')]);
      if (requestEpoch !== epoch) return;
      if (revision !== backend.revision) { setTimeout(syncData, 0); return; }
      tasks = nextTasks; projects = nextProjects; dataReady = true;
      $('sync-notice').hidden = true; $('live-dot').classList.remove('stale');
      render();
    } catch(error) {
      if (requestEpoch !== epoch) return;
      console.error(error);
      $('sync-message').textContent = backend.isUnauthorized(error)
        ? 'Your session may have expired. Please sign in again.'
        : /partial collection/i.test(String(error && error.message))
          ? 'BreadBackend returned only part of a collection. Pagination support is needed to load the board safely.'
          : /ownerId/i.test(String(error && error.message))
            ? 'Some documents have no ownerId. Check the backend schema or data migration.'
            : 'Could not sync with BreadBackend. Check the connection and project rules.';
      $('sync-notice').hidden = false; $('live-dot').classList.add('stale');
      if (!dataReady) $('list').innerHTML = '<div class="empty">Could not load your board. Retry above.</div>';
    }
  })();
  syncPromise = promise;
  try { await promise; } finally {
    if (syncPromise === promise) {
      syncPromise = null;
      if (syncAgain && requestEpoch === epoch) { syncAgain = false; setTimeout(syncData, 0); }
    }
  }
}
$('sync-retry').addEventListener('click', syncData);
document.addEventListener('visibilitychange', () => { if (!document.hidden && backend.user) syncData(); });
window.addEventListener('online', () => { if (backend.user) syncData(); });

const PRIORITY_ORDER = { Urgent:0, High:1, Medium:2, Low:3 };
function sortTasks(a,b){
  const pd = (PRIORITY_ORDER[a.priority] ?? PRIORITY_ORDER.Medium) - (PRIORITY_ORDER[b.priority] ?? PRIORITY_ORDER.Medium);
  if (pd !== 0) return pd;
  const ad = a.deadline ? new Date(a.deadline) : new Date('9999-12-31');
  const bd = b.deadline ? new Date(b.deadline) : new Date('9999-12-31');
  return ad - bd;
}

function fmtDeadline(d){
  if (!d) return null;
  const date = new Date(String(d).replace(' ', 'T'));
  if (isNaN(date)) return null;
  const now = new Date();
  const diffMs = date - now;
  const opts = { weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' };
  const str = date.toLocaleString(undefined, opts);
  let cls = '';
  if (diffMs < 0) cls = 'overdue';
  else if (diffMs < 1000*60*60*24) cls = 'soon';
  return { str, cls };
}

function escapeHtml(str){
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function rowHtml(t){
  const priority = ['Urgent','High','Medium','Low'].includes(t.priority) ? t.priority : 'Medium';
  const pClass = 'p-' + priority.toLowerCase();
  const dl = fmtDeadline(t.deadline);
  const color = projectColor(t.project);
  const pname = projectName(t.project);
  let metaParts = [];
  if (dl) metaParts.push(`<span class="deadline ${dl.cls}">${dl.str}${dl.cls==='overdue'?' · overdue':''}</span>`);
  metaParts.push(`<span class="priority-word ${pClass}">${priority}</span>`);
  if (pname) metaParts.push(`<span class="project-tag"><span class="dot" style="background:${color}"></span>${escapeHtml(pname)}</span>`);
  return `<div class="row ${pClass}">
    <div>
      <div class="row-title">${escapeHtml(t.title)}</div>
      <div class="row-meta">${metaParts.join('')}</div>
    </div>
  </div>`;
}

function render(){
  if (!dataReady) return;
  const open = tasks.filter(t=>t.status!=='Done').sort(sortTasks);
  const inProgress = open.filter(t=>t.status==='In Progress');
  const todo = open.filter(t=>t.status!=='In Progress');

  if (!open.length) {
    $('list').innerHTML = `<div class="empty">Nothing outstanding. Clear board.</div>`;
    return;
  }

  let html = '';
  if (inProgress.length) {
    html += `<div class="col-label">In progress <span class="n">${inProgress.length}</span></div>`;
    html += inProgress.map(rowHtml).join('');
  }
  if (todo.length) {
    html += `<div class="col-label">To do <span class="n">${todo.length}</span></div>`;
    html += todo.map(rowHtml).join('');
  }
  $('list').innerHTML = html;
}

function startClock(){
  function tick(){
    const now = new Date();
    $('clock-text').textContent = now.toLocaleString(undefined, { weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
    // Re-render deadline "overdue/soon" states as time passes
    render();
  }
  tick();
  clockTimer = setInterval(tick, 30000);
}
restoreSession();
</script>
</body>
</html>

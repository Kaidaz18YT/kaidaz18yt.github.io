<!DOCTYPE html>
<html lang=en>
<head><meta charset="utf-8"><title>PocketBase test</title></head>
<body>
  <h1>Notes</h1>
  <input id="text" placeholder="Write a note">
  <button id="add">Add</button>
  <ul id="list"></ul>

  <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.2/dist/pocketbase.umd.js"></script>
  <script>
    const pb = new PocketBase("https://kaidaz18.duckdns.org");

    async function load() {
      const res = await pb.collection("notes").getList(1, 50);
      document.getElementById("list").innerHTML =
        res.items.map(n => "<li>" + n.text.replace(/</g, "&lt;") + "</li>").join("");
    }

    document.getElementById("add").onclick = async () => {
      const box = document.getElementById("text");
      await pb.collection("notes").create({ text: box.value });
      box.value = "";
      load();
    };

    load();
  </script>
</body>
</html>

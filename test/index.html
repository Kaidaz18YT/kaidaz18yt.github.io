<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFO Backend Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
  h1 { color: #f59e0b; margin-bottom: 20px; }
  h2 { color: #38bdf8; margin: 20px 0 10px; }
  .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  button { background: #f59e0b; color: #0f172a; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 4px; }
  button:hover { background: #d97706; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  input, textarea { background: #334155; color: #e2e8f0; border: 1px solid #475569; padding: 8px 12px; border-radius: 6px; width: 100%; margin: 4px 0; }
  pre { background: #0f172a; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; margin-top: 8px; white-space: pre-wrap; }
  .ok { color: #4ade80; }
  .err { color: #f87171; }
  img { max-width: 300px; border-radius: 8px; margin-top: 8px; }
  .status { font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>

<h1>🧪 AFO Backend Test Page</h1>

<div class="card">
  <h2>1. Health Check</h2>
  <button onclick="testHealth()">Test Health</button>
  <pre id="health-result">Click the button...</pre>
</div>

<div class="card">
  <h2>2. Create a Document</h2>
  <input id="doc-title" placeholder="Title" value="Hello from test page!">
  <input id="doc-body" placeholder="Body" value="This is a test document.">
  <button onclick="testCreate()">Create Document</button>
  <pre id="create-result">Click the button...</pre>
</div>

<div class="card">
  <h2>3. Read Documents</h2>
  <button onclick="testRead()">Read All Documents</button>
  <pre id="read-result">Click the button...</pre>
</div>

<div class="card">
  <h2>4. Upload a File</h2>
  <input type="file" id="file-input">
  <button onclick="testUpload()">Upload File</button>
  <pre id="upload-result">Click the button...</pre>
  <div id="upload-preview"></div>
</div>

<div class="card">
  <h2>5. List Uploaded Files</h2>
  <button onclick="testListFiles()">List Files</button>
  <pre id="files-result">Click the button...</pre>
</div>

<script>
const BASE = "https://kaidaz18.duckdns.org/api/v1/test";
const API_KEY = "pk_live_b1CZ4vUnaOQCoMngCE0WxFm0";

function show(id, text, ok) {
  const el = document.getElementById(id);
  el.textContent = typeof text === "string" ? text : JSON.stringify(text, null, 2);
  el.className = ok ? "ok" : "";
}

async function testHealth() {
  try {
    const res = await fetch("https://kaidaz18.duckdns.org/api/health");
    const text = await res.text();
    show("health-result", `Status: ${res.status}\n${text}`, res.ok);
  } catch (e) {
    show("health-result", "ERROR: " + e.message);
  }
}

async function testCreate() {
  try {
    const title = document.getElementById("doc-title").value;
    const body = document.getElementById("doc-body").value;
    const res = await fetch(BASE + "/collections/posts", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": API_KEY
      },
      body: JSON.stringify({ title, body })
    });
    const data = await res.json();
    show("create-result", data, res.ok);
  } catch (e) {
    show("create-result", "ERROR: " + e.message);
  }
}

async function testRead() {
  try {
    const res = await fetch(BASE + "/collections/posts", {
      headers: { "x-api-key": API_KEY }
    });
    const data = await res.json();
    show("read-result", data, res.ok);
  } catch (e) {
    show("read-result", "ERROR: " + e.message);
  }
}

async function testUpload() {
  const fileInput = document.getElementById("file-input");
  if (!fileInput.files.length) {
    show("upload-result", "Please select a file first!");
    return;
  }
  try {
    const formData = new FormData();
    formData.append("file", fileInput.files[0]);
    const res = await fetch(BASE + "/upload", {
      method: "POST",
      headers: { "x-api-key": API_KEY },
      body: formData
    });
    const data = await res.json();
    show("upload-result", data, res.ok);
    if (res.ok && data.fullUrl) {
      const preview = document.getElementById("upload-preview");
      if (data.mimeType && data.mimeType.startsWith("image/")) {
        preview.innerHTML = `<img src="${data.fullUrl}" alt="uploaded">`;
      } else {
        preview.innerHTML = `<a href="${data.fullUrl}" target="_blank" style="color:#38bdf8">Open file</a>`;
      }
    }
  } catch (e) {
    show("upload-result", "ERROR: " + e.message);
  }
}

async function testListFiles() {
  try {
    const res = await fetch(BASE + "/files", {
      headers: { "x-api-key": API_KEY }
    });
    const data = await res.json();
    show("files-result", data, res.ok);
  } catch (e) {
    show("files-result", "ERROR: " + e.message);
  }
}
</script>

</body>
</html>
